
name: Build Ganapati Club APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          unzip -o ganapati-club-apk-project.zip -d extracted

      - name: Install dependencies
        working-directory: extracted/ganapati-club-apk-project
        run: npm install

      - name: Add Android platform
        working-directory: extracted/ganapati-club-apk-project
        run: npx cap add android

      - name: Sync Android project
        working-directory: extracted/ganapati-club-apk-project
        run: npx cap sync android

      - name: Build APK
        working-directory: extracted/ganapati-club-apk-project
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ganapati-club-debug-apk
          path: extracted/ganapati-club-apk-project/android/app/build/outputs/apk/debug/app-debug.apk
